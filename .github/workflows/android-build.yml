# Builds installable APKs and runs the mandatory map benchmark.
#
# - main: builds the phone APK (arm64) and publishes it as the pre-release
#   build-main.
# - Every other branch: builds one test APK (arm64 for the phone, x86_64 for
#   the emulator; only the JS bundle is rebuilt when nothing native changed),
#   runs the map benchmark with it on Android emulators (young, aged and
#   cities worlds in parallel) and publishes it as the pre-release
#   build-<branch>, also when a benchmark fails, so it can still be tried on
#   the phone. The run fails unless all benchmarks pass (rules in
#   src/bench/benchmark.ts).
#
# Deleting a branch removes its release again.
name: Android build

on:
  push:
    branches: ['**']
    # Docs-only commits don't change the app, so they don't need a new APK.
    paths-ignore:
      - 'Design Documents/**'
      - '**/*.md'
      - 'LICENSE'
  delete:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.event.ref || github.ref }}
  cancel-in-progress: true

jobs:
  release:
    if: github.event_name != 'delete' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      # Only 64-bit ARM (practically every phone of the last years); compiling
      # native code for all four CPU types took most of the build time.
      # The build label is shown in the app so it's clear which build is installed.
      - name: Build release APK
        env:
          EXPO_PUBLIC_BUILD_LABEL: ${{ github.ref_name }} · ${{ github.sha }}
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Sign and publish
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: scripts/publish-apk.sh android/app/build/outputs/apk/release/app-release.apk

  # Feature branches, step 1: the test APK (arm64 for the phone, x86_64 for
  # the emulator). When nothing native changed since an earlier build (same
  # Expo fingerprint), that build's APK comes from the cache and only the JS
  # bundle is swapped in (scripts/swap-js-bundle.sh, byte-identical to what
  # Gradle would build): about a minute instead of a full native build.
  test-apk:
    if: github.event_name != 'delete' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_BUILD_LABEL: ${{ github.ref_name }} · ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - name: Native fingerprint
        id: fingerprint
        run: echo "hash=$(npx fingerprint fingerprint:generate --platform android | node -p 'JSON.parse(require("fs").readFileSync(0)).hash')" >> "$GITHUB_OUTPUT"

      # Bump the version when the native build itself changes (e.g. the CPU types below).
      - name: Native APK from an earlier build
        id: native-cache
        uses: actions/cache@v4
        with:
          path: native-apk
          key: native-test-apk-v1-${{ steps.fingerprint.outputs.hash }}

      - uses: actions/setup-java@v5
        if: steps.native-cache.outputs.cache-hit != 'true'
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5
        if: steps.native-cache.outputs.cache-hit != 'true'

      - name: Generate native Android project
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: npx expo prebuild --platform android --no-install

      # One APK for both: arm64 runs on the phone, x86_64 on the emulator.
      - name: Build native APK
        if: steps.native-cache.outputs.cache-hit != 'true'
        working-directory: android
        run: |
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,x86_64
          mkdir -p ../native-apk
          cp app/build/outputs/apk/release/app-release.apk ../native-apk/base.apk

      - name: Swap in this commit's JS bundle
        run: scripts/swap-js-bundle.sh native-apk/base.apk test.apk

      - uses: actions/upload-artifact@v5
        with:
          name: test-apk
          path: test.apk
          retention-days: 7

  # Step 2: the map benchmark, one emulator per scenario in parallel. The
  # emulator starts from a cached snapshot taken once it had settled after its
  # first boot, which skips most of the boot and settling time. It runs plain
  # Android without Google Play services (target: default): the app doesn't
  # use them, and their config sync about 1.5 min after start took most of the
  # emulator's CPU and cost frames in the middle of the benchmark.
  benchmark:
    needs: test-apk
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        scenario: [young, aged, cities]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: test-apk

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulator snapshot
        id: avd-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api34-x86_64-aosp-settled-v1

      - name: Create the emulator and save a settled snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          force-avd-creation: false
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: scripts/settle-emulator.sh

      # System animations stay on: the benchmark measures real animation frames.
      - name: Run map benchmark on the emulator
        # Boot, settle (at most 10 min) and benchmark take about 8-18 min. The
        # emulator sometimes hangs on shutdown; don't let that hold the run.
        timeout-minutes: 25
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          force-avd-creation: false
          disable-animations: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: scripts/run-benchmark.sh test.apk benchmark-results ${{ matrix.scenario }}

      - name: Upload benchmark results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: benchmark-results-${{ matrix.scenario }}
          path: benchmark-results
          if-no-files-found: ignore

  # Step 3: published even when a benchmark failed, so the build can still be
  # tried on the phone; the release notes and the red run show the result.
  test-release:
    needs: [test-apk, benchmark]
    if: ${{ !cancelled() && needs.test-apk.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: test-apk

      - uses: actions/download-artifact@v5
        with:
          pattern: benchmark-results-*
          path: results

      - name: Sign and publish test APK
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          NOTES=""
          for scenario in young aged cities; do
            f="results/benchmark-results-$scenario/summary.json"
            if [ -f "$f" ]; then
              RESULT=$(node -p "const s=require('./$f'); (s.pass ? 'PASSED' : 'FAILED') + ' (failed swipes: ' + s.failed + '/' + s.swipes + ')'")
            else
              RESULT="no result"
            fi
            NOTES="$NOTES"$'\n'"Map benchmark, $scenario worlds: $RESULT"
          done
          export NOTES_EXTRA=$'\n'"$NOTES"
          scripts/publish-apk.sh test.apk

  cleanup:
    if: github.event_name == 'delete' && github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - name: Remove the deleted branch's release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release delete "build-${{ github.event.ref }}" --cleanup-tag --yes || true
