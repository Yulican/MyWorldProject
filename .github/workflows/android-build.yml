# Builds an installable APK for every pushed branch and publishes it on a
# GitHub release named after the branch, so it can be downloaded on the phone.
# Deleting a branch removes its release again.
name: Android build

on:
  push:
    branches: ['**']
    # Docs-only commits don't change the app, so they don't need a new APK.
    paths-ignore:
      - 'Design Documents/**'
      - '**/*.md'
      - 'LICENSE'
  delete:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.event.ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'delete'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TAG: build-${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      # Test builds only target 64-bit ARM (practically every phone of the
      # last years). Compiling native code for all four CPU types took most of
      # the build time. Local builds still use the project default (all types).
      # The build label is shown in the app so it's clear which build is installed.
      - name: Build release APK
        env:
          EXPO_PUBLIC_BUILD_LABEL: ${{ github.ref_name }} · ${{ github.sha }}
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      # Re-sign with the project keystore so new builds install over old ones
      # (keeps save games). Without the secrets the APK stays debug-signed.
      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          # The commit in the name keeps file names unique: re-downloading a
          # name that is already on the phone makes the browser ask to download
          # it again and leaves two APKs behind.
          OUT="MyWorld-${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}.apk"
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No keystore secrets set - APK is debug-signed. Installing it over a build with a different signature requires uninstalling first."
            cp "$APK" "$OUT"
          else
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
            "$BUILD_TOOLS/zipalign" -f -p 4 "$APK" aligned.apk
            "$BUILD_TOOLS/apksigner" sign --ks release.keystore --ks-pass env:KEYSTORE_PASSWORD \
              --ks-key-alias "$KEY_ALIAS" --out "$OUT" aligned.apk
            rm release.keystore
          fi
          echo "APK_FILE=$OUT" >> "$GITHUB_ENV"

      - name: Publish release for this branch
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          gh release delete "$TAG" --cleanup-tag --yes || true
          gh release create "$TAG" "$APK_FILE" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Build: $GITHUB_REF_NAME" \
            --notes "Branch \`$GITHUB_REF_NAME\` at ${GITHUB_SHA::7}: $COMMIT_MESSAGE"

  # Mandatory map performance test (rules in src/bench/benchmark.ts): an x86_64
  # build with the benchmark switched on runs on an Android emulator; the job
  # fails unless every swipe passes. Runs in parallel with the phone build.
  benchmark:
    if: github.event_name != 'delete'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      # The emulator is x86_64, so this build targets x86_64 instead of arm64.
      - name: Build benchmark APK
        env:
          EXPO_PUBLIC_BENCHMARK: '1'
          EXPO_PUBLIC_BUILD_LABEL: benchmark · ${{ github.ref_name }} · ${{ github.sha }}
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=x86_64

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # System animations stay on: the benchmark measures real animation frames.
      - name: Run benchmark on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: scripts/run-benchmark.sh android/app/build/outputs/apk/release/app-release.apk benchmark-results

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: benchmark-results
          path: benchmark-results
          if-no-files-found: ignore

  cleanup:
    if: github.event_name == 'delete' && github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - name: Remove the deleted branch's release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release delete "build-${{ github.event.ref }}" --cleanup-tag --yes || true
